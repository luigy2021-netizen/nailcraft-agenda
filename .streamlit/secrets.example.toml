# Copiar como .streamlit/secrets.toml. No subir el archivo real al repositorio.
[auth]
redirect_uri = "https://TU-DOMINIO/oauth2callback"
cookie_secret = "GENERA_UN_SECRETO_LARGO_Y_ALEATORIO"
client_id = "TU_CLIENT_ID.apps.googleusercontent.com"
client_secret = "TU_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[firebase]
project_id = "tu-proyecto"
# Use UNA opción:
service_account_file = "service-account.json"
# service_account_json = '''{"type":"service_account", ...}'''

[platform]
master_emails = ["administracion@tudominio.com"]
default_timezone = "America/Ciudad_Juarez"

