<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nailcraft Agenda</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/app/static/apple-touch-icon.png?v=20260530">
  <link rel="icon" type="image/png" sizes="192x192" href="/app/static/icon-192.png?v=20260530">
  <link rel="manifest" href="/app/static/manifest.webmanifest?v=20260530">
  <meta name="apple-mobile-web-app-title" content="Nailcraft">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#a40ac5">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff9fd;
      color: #27152d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      max-width: 420px;
      text-align: center;
    }

    img {
      width: 132px;
      height: 132px;
      border-radius: 30px;
      box-shadow: 0 22px 70px rgba(0,0,0,.4);
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 30px;
      line-height: 1.05;
    }

    p {
      color: #735f78;
      line-height: 1.5;
      margin: 0 0 22px;
    }

    a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, #d823e5, #8b05bd);
      color: white;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/app/static/apple-touch-icon.png?v=20260530" alt="Nailcraft">
    <h1>Nailcraft</h1>
    <p>Agenda tu cita y disfruta unas uñas increíbles.</p>
    <a href="/">Abrir agenda</a>
  </main>
</body>
</html>
